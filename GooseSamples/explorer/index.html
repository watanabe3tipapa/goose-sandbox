<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>探訪ビュー — Goose サンプル探訪</title>
<meta name="description" content="Goose 公式サンプル 31 本を、カテゴリ・難易度・必要な環境で絞り込み、解説とソースコードを 1 画面で読める探訪ビュー。">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23ffffff'/%3E%3Crect x='7' y='7' width='18' height='18' fill='%2300e5a8' stroke='%230b0b0b' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&amp;family=Roboto+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --panel: #fafafa;
  --fg: #0b0b0b;
  --faint: #525252;
  --line: #dedede;
  --border: #0b0b0b;
  --accent: #00e5a8;
  --accent-soft: #d9fff4;
  --accent-ink: #007a5a;
  --warn: #ffc857;
  --danger: #ff6b6b;
  --info: #b8dcff;
  --radius: 3px;
  --font-ui: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  --font-mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, "Noto Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
body.detail-open { overflow: hidden; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 8px; top: -60px; z-index: 100;
  background: var(--fg); color: var(--bg); padding: 8px 14px; text-decoration: none;
}
.skip:focus { top: 8px; }

/* ---------- top bar ---------- */
.topbar {
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 0 18px;
  border-bottom: 3px solid var(--border);
  background: var(--bg);
  position: relative;
  z-index: 45;
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  letter-spacing: -0.01em;
  text-decoration: none;
  white-space: nowrap;
}
.brand .mark {
  width: 13px; height: 13px;
  background: var(--accent);
  border: 2px solid var(--border);
  transform: rotate(45deg);
  flex: none;
}
.brand small {
  display: block;
  font-family: var(--font-mono);
  font-size: 0.6rem;
  font-weight: 400;
  color: var(--faint);
  letter-spacing: 0.08em;
  line-height: 1.2;
}
.top-right { display: flex; align-items: center; gap: 14px; }
.mini-progress {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--faint);
  white-space: nowrap;
}
.mini-progress b { color: var(--fg); }
.top-link {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  text-decoration: none;
  border: 2px solid var(--border);
  padding: 4px 9px;
  border-radius: 2px;
  background: var(--bg);
  white-space: nowrap;
}
.top-link:hover { background: var(--accent); }

/* ---------- layout ---------- */
.app {
  display: grid;
  grid-template-columns: 222px 386px minmax(0, 1fr);
  height: calc(100dvh - 58px);
}
.filters {
  border-right: 2px solid var(--border);
  background: var(--panel);
  padding: 16px 14px 28px;
  overflow-y: auto;
}
.listpane {
  border-right: 2px solid var(--border);
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.detail {
  min-width: 0;
  overflow-y: auto;
  background: var(--bg);
}

/* ---------- filters ---------- */
.filter-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 16px;
}
.filter-head h2 {
  font-size: 0.7rem;
  font-family: var(--font-mono);
  letter-spacing: 0.16em;
  text-transform: uppercase;
}
.reset {
  border: 0;
  background: none;
  font-size: 0.7rem;
  color: var(--faint);
  text-decoration: underline;
  cursor: pointer;
  padding: 2px;
}
.reset:hover { color: var(--fg); }
.filter-section { margin-bottom: 20px; }
.filter-section h3 {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 7px;
}
.filter-section ul { list-style: none; display: flex; flex-direction: column; gap: 2px; }
.opt {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  border: 2px solid transparent;
  background: none;
  padding: 5px 7px;
  border-radius: 2px;
  font-size: 0.8rem;
  text-align: left;
  cursor: pointer;
  line-height: 1.35;
}
.opt span { min-width: 0; }
.opt b {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 400;
  color: var(--faint);
  flex: none;
}
.opt:hover { background: var(--accent-soft); }
.opt[aria-pressed="true"] { border-color: var(--border); background: var(--accent); font-weight: 700; }
.opt[aria-pressed="true"] b { color: var(--fg); }

.progress-box { border-top: 2px solid var(--border); padding-top: 14px; margin-top: 6px; }
.progress-box p {
  font-family: var(--font-mono);
  font-size: 0.64rem;
  color: var(--faint);
  margin-top: 7px;
  display: flex;
  justify-content: space-between;
}
.progress-box b { color: var(--fg); }
.bar { height: 8px; border: 2px solid var(--border); background: var(--bg); border-radius: 2px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s ease; }

/* ---------- list ---------- */
.toolbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-bottom: 2px solid var(--border);
  background: var(--bg);
  flex-wrap: wrap;
}
.toolbar input[type="search"] {
  flex: 1 1 150px;
  min-width: 0;
  border: 2px solid var(--border);
  border-radius: 2px;
  padding: 7px 10px;
  font-size: 0.84rem;
  background: var(--bg);
}
.toolbar input::placeholder { color: #8a8a8a; }
.toolbar select {
  border: 2px solid var(--border);
  border-radius: 2px;
  padding: 7px 6px;
  font-size: 0.74rem;
  background: var(--bg);
  max-width: 128px;
}
.filter-toggle {
  display: none;
  border: 2px solid var(--border);
  background: var(--bg);
  border-radius: 2px;
  padding: 6px 10px;
  font-size: 0.74rem;
  cursor: pointer;
}
.result-line {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 7px 12px;
  border-bottom: 2px solid var(--border);
  font-family: var(--font-mono);
  font-size: 0.64rem;
  color: var(--faint);
  background: var(--panel);
  min-height: 35px;
}
.result-line b { color: var(--fg); }
.chip-active {
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 999px;
  padding: 1px 8px;
  color: var(--fg);
}
.cards {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.card {
  display: block;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  padding: 10px 12px 11px;
  text-decoration: none;
  box-shadow: 2px 2px 0 var(--border);
  transition: transform .08s ease, box-shadow .08s ease, background .08s ease;
}
.card:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--border); }
.card[aria-current="true"] { background: var(--accent-soft); border-left-width: 6px; padding-left: 8px; }
.card-top {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--faint);
}
.card-no {
  background: var(--fg);
  color: var(--bg);
  font-weight: 700;
  padding: 0 5px;
  border-radius: 2px;
  line-height: 1.5;
}
.card-cat { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-title {
  display: block;
  margin: 6px 0 3px;
  font-weight: 700;
  font-size: 0.96rem;
  line-height: 1.35;
  letter-spacing: -0.01em;
}
.card-sum {
  font-size: 0.76rem;
  line-height: 1.55;
  color: var(--faint);
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 0.62rem;
  color: var(--faint);
}
.card-foot .read { margin-left: auto; color: var(--accent-ink); font-weight: 700; }
.card.is-read .card-title { color: var(--accent-ink); }
.empty {
  padding: 34px 18px;
  text-align: center;
  color: var(--faint);
  font-size: 0.84rem;
}
.empty b { display: block; color: var(--fg); margin-bottom: 4px; }

/* ---------- detail ---------- */
.detail-inner { padding: 22px 26px 56px; max-width: 960px; }
.detail-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 0.64rem;
}
.detail-num {
  background: var(--fg);
  color: var(--bg);
  font-weight: 700;
  padding: 1px 7px;
  border-radius: 2px;
  font-size: 0.72rem;
}
.chip {
  border: 2px solid var(--border);
  border-radius: 999px;
  padding: 1px 9px;
  background: var(--bg);
}
.chip.level-intro { background: #8ef0cf; }
.chip.level-intermediate { background: var(--warn); }
.chip.level-advanced { background: var(--info); }
.detail-close {
  margin-left: auto;
  border: 2px solid var(--border);
  background: var(--bg);
  width: 32px;
  height: 32px;
  border-radius: 2px;
  cursor: pointer;
  font-size: 1.1rem;
  line-height: 1;
  display: none;
  align-items: center;
  justify-content: center;
}
.detail-close:hover { background: var(--danger); }
.detail h2 {
  font-size: 1.72rem;
  line-height: 1.22;
  letter-spacing: -0.02em;
  margin: 12px 0 2px;
  overflow-wrap: anywhere;
}
.detail-orig {
  font-family: var(--font-mono);
  font-size: 0.68rem;
  color: var(--faint);
  margin-bottom: 14px;
}
.detail-summary { font-size: 0.94rem; margin-bottom: 16px; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.act {
  border: 2px solid var(--border);
  background: var(--bg);
  border-radius: 2px;
  padding: 5px 11px;
  font-size: 0.74rem;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 2px 2px 0 var(--border);
}
.act:hover { background: var(--accent); }
.act[aria-pressed="true"] { background: var(--accent); }
.act.ghost { box-shadow: none; text-decoration: underline; border-color: transparent; padding-left: 2px; }
.act.ghost:hover { background: none; }
.detail-meta {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 0;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 22px;
  overflow: hidden;
}
.detail-meta > div { padding: 8px 11px; border-right: 1px solid var(--line); }
.detail-meta > div:last-child { border-right: 0; }
.detail-meta dt {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
}
.detail-meta dd { font-size: 0.8rem; font-weight: 700; margin-top: 1px; }
.detail h3 {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin: 24px 0 9px;
  padding-bottom: 4px;
  border-bottom: 2px solid var(--border);
}
.shows { list-style: none; display: flex; flex-direction: column; gap: 7px; }
.shows li { padding-left: 18px; position: relative; font-size: 0.86rem; }
.shows li::before {
  content: "▸";
  position: absolute;
  left: 0;
  color: var(--accent-ink);
  font-weight: 700;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  font-family: var(--font-mono);
  font-size: 0.64rem;
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 2px;
  padding: 2px 7px;
}
.run-wrap { display: flex; gap: 8px; align-items: stretch; }
.run {
  flex: 1;
  min-width: 0;
  border: 2px solid var(--border);
  background: #0b0b0b;
  color: #e8e8e8;
  padding: 9px 11px;
  border-radius: 2px;
  font: 0.76rem/1.5 var(--font-mono);
  overflow-x: auto;
  white-space: pre;
}
.run .prompt { color: var(--accent); }
.note {
  font-size: 0.76rem;
  color: var(--faint);
  margin-top: 8px;
  padding-left: 10px;
  border-left: 3px solid var(--line);
}
.source-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.source-head h3 { flex: 1; }
.source-head span { font-family: var(--font-mono); font-size: 0.6rem; color: var(--faint); }
.source-actions { display: flex; gap: 8px; margin: 0 0 8px; }
.code {
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: #fcfcfc;
  overflow: auto;
  max-height: 68vh;
  font: 12px/1.6 var(--font-mono);
  tab-size: 4;
}
.code code { display: block; padding: 10px 0; }
.code .line { display: block; white-space: pre; }
.code .line:hover { background: #fff8e1; }
.code .ln {
  display: inline-block;
  width: 3.6em;
  padding-right: 0.9em;
  margin-right: 0.9em;
  text-align: right;
  color: #a3a3a3;
  border-right: 1px solid #ececec;
  user-select: none;
}
.tok-comment { color: #6b7280; font-style: italic; }
.tok-string { color: #047857; }
.tok-number { color: #be123c; }
.tok-keyword { color: #1d4ed8; font-weight: 700; }
.tok-type { color: #b45309; }
.pager {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 30px;
  padding-top: 16px;
  border-top: 2px solid var(--border);
}
.pager a, .pager span {
  font-size: 0.78rem;
  text-decoration: none;
  max-width: 46%;
  overflow-wrap: anywhere;
}
.pager a { border-bottom: 2px solid var(--accent); }
.pager span { color: var(--faint); }
.pager .next { text-align: right; margin-left: auto; }
.detail-placeholder {
  padding: 46px 26px;
  color: var(--faint);
  font-size: 0.85rem;
}
.detail-placeholder b { display: block; color: var(--fg); font-size: 1rem; margin-bottom: 6px; }
.source-error {
  border: 2px solid var(--danger);
  background: #ffe3e3;
  padding: 12px 14px;
  border-radius: 2px;
  font-size: 0.8rem;
}
.source-error a { color: var(--fg); }
.loading { color: var(--faint); font-size: 0.8rem; }
.fatal {
  max-width: 640px;
  margin: 60px auto;
  border: 3px solid var(--danger);
  background: #ffe3e3;
  padding: 22px 24px;
  border-radius: var(--radius);
}
.fatal h1 { font-size: 1.15rem; margin-bottom: 8px; }
.fatal code { background: var(--bg); border: 1px solid var(--border); padding: 1px 5px; font-family: var(--font-mono); font-size: 0.8rem; }
.fatal p + p { margin-top: 10px; }
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translate(-50%, 18px);
  background: var(--fg);
  color: var(--bg);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 0.76rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .16s ease, transform .16s ease;
  z-index: 80;
}
.toast.is-on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- responsive ---------- */
@media (max-width: 1220px) {
  .app { grid-template-columns: 200px minmax(0, 1fr); }
  .detail {
    position: fixed;
    top: 58px;
    right: 0;
    bottom: 0;
    width: min(920px, 100%);
    border-left: 3px solid var(--border);
    transform: translateX(102%);
    visibility: hidden;
    transition: transform .18s ease, visibility 0s linear .18s;
    z-index: 40;
    box-shadow: -8px 0 0 rgba(0, 0, 0, 0.08);
  }
  .detail.is-open { transform: none; visibility: visible; transition: transform .18s ease, visibility 0s; }
  .detail-close { display: inline-flex; }
  .detail-inner { padding-bottom: 40px; }
}
@media (max-width: 760px) {
  body { overflow: auto; height: auto; }
  .app { grid-template-columns: 1fr; height: auto; }
  .filters {
    display: none;
    border-right: 0;
    border-bottom: 3px solid var(--border);
    padding: 14px;
  }
  .filters.is-open { display: block; }
  .listpane { border-right: 0; }
  .cards { overflow: visible; }
  .filter-toggle { display: inline-block; }
  .detail { top: 58px; width: 100%; }
  .detail-inner { padding: 18px 16px 40px; }
  .detail h2 { font-size: 1.42rem; }
  .mini-progress { display: none; }
  .code { max-height: 60vh; }
  .topbar { padding: 0 12px; }
  .brand { font-size: 0.9rem; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
  .card:hover { transform: none; }
}
@media print {
  .filters, .listpane, .toolbar, .topbar, .detail-actions, .pager { display: none; }
  body { overflow: visible; height: auto; }
  .app { display: block; height: auto; }
  .detail { position: static; transform: none; visibility: visible; border: 0; width: auto; }
  .code { max-height: none; border-color: #999; }
}
</style>
</head>
<body>

<a class="skip" href="#cards">サンプル一覧へ</a>

<header class="topbar">
  <a class="brand" href="../">
    <span class="mark" aria-hidden="true"></span>
    <span>Goose サンプル探訪<small>31 samples · annotated</small></span>
  </a>
  <div class="top-right">
    <span class="mini-progress"><b id="mini-read">0</b> / 31 読了</span>
    <a class="top-link" href="../">LP</a>
  </div>
</header>

<div class="app">

  <aside class="filters" id="filters" aria-label="絞り込み">
    <div class="filter-head">
      <h2>Filters</h2>
      <button class="reset" id="reset" type="button">リセット</button>
    </div>

    <section class="filter-section">
      <h3>カテゴリ</h3>
      <ul id="category-list"></ul>
    </section>

    <section class="filter-section">
      <h3>難易度</h3>
      <ul id="level-list"></ul>
    </section>

    <section class="filter-section">
      <h3>必要な環境</h3>
      <ul id="requirement-list"></ul>
    </section>

    <section class="filter-section">
      <h3>読了</h3>
      <ul>
        <li>
          <button class="opt" type="button" id="unread-toggle" data-filter="unread" data-value="1" aria-pressed="false">
            <span>未読のみ</span><b id="unread-count">31</b>
          </button>
        </li>
      </ul>
    </section>

    <div class="progress-box">
      <div class="bar" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="31" aria-valuenow="0" aria-label="読了の進捗">
        <span id="progress-fill"></span>
      </div>
      <p><span>読了</span><b id="progress-text">0 / 31</b></p>
    </div>
  </aside>

  <section class="listpane" aria-label="サンプル一覧">
    <div class="toolbar">
      <button class="filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">絞り込み</button>
      <label class="sr-only" for="search">サンプルを検索</label>
      <input id="search" type="search" placeholder="検索（/ でフォーカス）" autocomplete="off" spellcheck="false">
      <label class="sr-only" for="sort">並び順</label>
      <select id="sort">
        <option value="number">番号順</option>
        <option value="lines">行数（多い順）</option>
        <option value="title">名前順</option>
      </select>
    </div>
