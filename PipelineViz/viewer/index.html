<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Viz — Goose × oh-my-mermaid 試作ダッシュボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --fg: #0b0b0b;
  --ink: #0b0b0b;
  --muted: #f2f2f2;
  --muted-2: #e9e9e9;
  --surface: #ffffff;
  --surface-2: #f7f7f7;
  --surface-3: #ededed;
  --bg-deep: #f2f2f2;
  --border: #0b0b0b;
  --line: #d4d4d4;
  --line-strong: #0b0b0b;
  --faint: #525252;
  --accent: #00e5a8;
  --accent-ink: #007a5a;
  --accent-soft: #c9f7e8;
  --accent-dim: #0b0b0b;
  --accent-glow: #c9f7e8;
  --healthy: #8ef0cf;
  --warning: #ffc857;
  --error: #ff6b6b;
  --external: #b8dcff;
  --warn: #a16207;
  --danger: #c81e1e;
  --info: #1f6feb;
  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, "Noto Mono", monospace;
  --sans: Inter, "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
  --radius: 4px;
  --radius-sm: 3px;
  --space: clamp(1rem, 0.9rem + 0.5vw, 1.5rem);
  --step-0: clamp(0.9rem, 0.88rem + 0.15vw, 1rem);
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  padding: 18px;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: var(--step-0);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
::selection { background: var(--accent); color: var(--fg); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p, dl, dd, dt, ul, ol { margin: 0; }
ul, ol { padding-left: 1.3rem; }
li { margin-bottom: 0.3rem; }
small { font-size: 0.78em; }
code { font-family: var(--mono); border: 2px dashed var(--border); background: var(--bg); padding: 1px 6px; border-radius: 2px; font-size: 0.86em; }

.app {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "side top"
    "side main";
  min-height: calc(100vh - 36px);
  max-width: 1720px;
  margin: 0 auto;
  border: 5px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  overflow: clip;
}

.sidebar {
  grid-area: side;
  position: sticky;
  top: 18px;
  height: calc(100vh - 36px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
  padding: 1rem 0.9rem;
  border-right: 4px solid var(--border);
  background: var(--muted);
}
.brand {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  padding: 0.55rem 0.65rem;
  border: 3px solid var(--border);
  border-radius: 2px;
  background: var(--bg);
}
.brand-mark {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border: 2px solid var(--border);
  border-radius: 2px;
  background: var(--accent);
  color: var(--fg);
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
}
.brand strong { display: block; font-size: 0.92rem; font-weight: 700; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--faint); font-family: var(--mono); font-size: 0.58rem; }

.side-label {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  padding: 0 0.25rem;
  margin-bottom: 0.5rem;
}
#nav { display: flex; flex-direction: column; gap: 0.35rem; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 0.55rem;
  width: 100%;
  padding: 0.5rem 0.55rem;
  border: 3px solid transparent;
  border-radius: 2px;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease;
}
.nav-item:hover { background: var(--bg); border-color: var(--border); }
.nav-item.is-active {
  background: var(--accent);
  border-color: var(--border);
}
.nav-text { display: flex; flex-direction: column; line-height: 1.3; min-width: 0; flex: 1; }
.nav-text strong { font-size: 0.72rem; font-weight: 700; font-family: var(--mono); white-space: nowrap; }
.nav-text small { color: var(--faint); font-size: 0.65rem; }
.nav-item.is-active .nav-text small { color: var(--fg); }
.nav-badge {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 700;
  color: var(--fg);
  background: var(--bg);
  border: 2px solid var(--border);
  border-radius: 2px;
  padding: 0 0.35em;
}
.status-dot {
  width: 10px; height: 10px;
  border: 2px solid var(--border);
  border-radius: 2px;
  flex-shrink: 0;
  background: var(--muted-2);
}
.status-dot.s-healthy { background: var(--healthy); }
.status-dot.s-warning { background: var(--warning); }
.status-dot.s-error { background: var(--error); }
.status-dot.s-external { background: var(--external); }
.status-dot.s-paused { background: var(--muted-2); }

.side-store dl { display: grid; gap: 0.35rem; padding: 0 0.25rem; }
.side-store dl > div { display: flex; justify-content: space-between; gap: 0.5rem; font-family: var(--mono); font-size: 0.62rem; }
.side-store dt { color: var(--faint); }
.side-store dd { color: var(--fg); text-align: right; word-break: break-all; }

.legend-block { border-top: 4px solid var(--border); padding-top: 0.9rem; }
.legend-item { display: flex; align-items: center; gap: 0.45rem; font-size: 0.72rem; color: var(--fg); margin-bottom: 0.3rem; padding: 0 0.25rem; }
.legend-swatch { width: 12px; height: 12px; border: 2px solid var(--border); border-radius: 2px; flex-shrink: 0; }
.swatch-healthy { background: var(--healthy); }
.swatch-warning { background: var(--warning); }
.swatch-error { background: var(--error); }
.swatch-external { background: var(--external); }
.swatch-diff { background: var(--bg); border-style: dashed; }

.topbar {
  grid-area: top;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.9rem 1.4rem;
  flex-wrap: wrap;
  padding: 1rem var(--space) 0.9rem;
  border-bottom: 4px solid var(--border);
  background: var(--bg);
  position: sticky;
  top: 18px;
  z-index: 20;
}
.crumb {
  font-family: var(--mono);
  font-size: 0.66rem;
  color: var(--faint);
  margin-bottom: 0.25rem;
}
.crumb b { color: var(--fg); background: var(--accent); padding: 0 4px; border: 2px solid var(--border); border-radius: 2px; font-weight: 700; }
.topbar h1 { font-size: clamp(1.2rem, 1rem + 0.7vw, 1.6rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; }
.page-sub { color: var(--faint); font-size: 0.8rem; margin-top: 0.1rem; }
.toolbar { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
.updated { font-family: var(--mono); font-size: 0.66rem; color: var(--faint); padding-right: 0.15rem; }
.updated b { color: var(--fg); font-weight: 700; }
.health-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  padding: 0.22rem 0.55rem;
  border: 3px solid var(--border);
  border-radius: 2px;
  background: var(--bg);
  color: var(--fg);
}
.health-pill .status-dot { width: 8px; height: 8px; }
.health-pill.is-healthy { background: var(--healthy); }
.health-pill.is-warning { background: var(--warning); }
.health-pill.is-error { background: var(--error); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.35rem;
  border: 3px solid var(--border);
  background: var(--bg);
  color: var(--fg);
  border-radius: 2px;
  padding: 0.22rem 0.7rem;
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}
.btn:hover { background: var(--fg); color: var(--bg); }
.btn[aria-pressed="true"] { background: var(--accent); color: var(--fg); }
.btn[aria-pressed="true"]:hover { background: var(--fg); color: var(--bg); }
.btn-live .live-dot { width: 8px; height: 8px; border: 2px solid currentColor; border-radius: 2px; background: currentColor; }
.btn-live[aria-pressed="false"] { background: var(--bg); color: var(--faint); }
.btn-ghost { background: var(--bg); }
.btn-danger { background: #ffe3e3; color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: var(--bg); }
.btn-danger.is-on { background: var(--danger); color: var(--bg); }

.main {
  grid-area: main;
  min-width: 0;
  padding: var(--space);
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.rail {
  grid-area: rail;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding: 0 var(--space) var(--space) 0;
  min-width: 0;
}

.card {
  min-width: 0;
  background: var(--bg);
  border: 3px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.1rem;
}
.card.flat { border-width: 2px; }
.card-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 0.8rem;
  flex-wrap: wrap;
  margin-bottom: 0.8rem;
}
.card-head h2, .card-head h3 { font-size: 1rem; font-weight: 700; line-height: 1.4; display: flex; align-items: center; gap: 0.5rem; }
.card-head h2::before, .card-head h3::before {
  content: "";
  width: 10px; height: 10px;
  flex-shrink: 0;
  background: var(--accent);
  border: 2px solid var(--border);
  border-radius: 1px;
}
.card-head .sub { color: var(--faint); font-size: 0.76rem; margin-top: 0.15rem; }
.eyebrow {
  display: block;
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  margin-bottom: 0.3rem;
}
.eyebrow.info { color: var(--info); }
.eyebrow.warn { color: var(--warn); }
.eyebrow.danger { color: var(--danger); }

.alert-strip {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  padding: 0.6rem 0.85rem;
  border: 3px solid var(--border);
  border-left-width: 12px;
  border-radius: 2px;
  background: var(--bg);
  font-size: 0.8rem;
}
.alert-strip.is-healthy { border-left-color: var(--healthy); background: var(--accent-soft); }
.alert-strip.is-warning { border-left-color: var(--warning); background: #fff4d6; }
.alert-strip.is-error { border-left-color: var(--error); background: #ffe3e3; }
.alert-strip strong { font-weight: 700; }
.alert-strip .alert-copy { flex: 1; min-width: 180px; color: var(--fg); }
.alert-strip .alert-copy b { font-weight: 700; }
.alert-strip .alert-link {
  border: 2px solid var(--border);
  background: var(--bg);
  border-radius: 2px;
  padding: 0.05rem 0.55rem;
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 700;
  cursor: pointer;
}
.alert-strip .alert-link:hover { background: var(--fg); color: var(--bg); }

.diagram-scroll { overflow-x: auto; max-width: 100%; padding: 0.2rem 0 0.5rem; }
.flow {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  min-width: max-content;
  padding: 0.3rem 0;
}
.flow.is-long .node {
  width: 156px;
  padding: 0.8rem 0.7rem 0.6rem;
}
.flow.is-long .node-records { font-size: 1rem; }
.flow.is-long .connector { min-width: 36px; }
.flow.is-long .connector-label { font-size: 0.52rem; }
.node {
  position: relative;
  width: 198px;
  flex-shrink: 0;
  text-align: left;
  padding: 1rem 0.9rem 0.75rem;
  border: 3px solid var(--border);
  border-radius: 2px;
  background: var(--bg);
  color: var(--fg);
  cursor: pointer;
  overflow: hidden;
  transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease;
}
.node::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 8px;
  background: var(--node-color, var(--muted-2));
  border-bottom: 2px solid var(--border);
}
.node:hover { background: var(--muted); transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--border); }
.node.is-selected { box-shadow: 4px 4px 0 var(--border); background: var(--accent-soft); }
.node.is-changed::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 2px dashed var(--info);
  pointer-events: none;
}
.node[data-status="Healthy"] { --node-color: var(--healthy); }
.node[data-status="Warning"] { --node-color: var(--warning); }
.node[data-status="Error"] { --node-color: var(--error); }
.node[data-status="External"] { --node-color: var(--external); }
.node-top { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; margin-bottom: 0.4rem; }
.node-name { font-weight: 700; font-size: 0.9rem; letter-spacing: -0.01em; }
.node-records { display: block; font-family: var(--mono); font-size: 1.2rem; font-weight: 700; line-height: 1.25; }
.node-records small { font-size: 0.55em; font-weight: 400; color: var(--faint); letter-spacing: 0.04em; }
.node-meta { display: block; font-family: var(--mono); font-size: 0.64rem; color: var(--faint); margin-top: 0.12rem; }
.node-diff {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--fg);
  background: var(--bg);
  border: 2px dashed var(--info);
  border-radius: 2px;
  padding: 0 0.35em;
  margin-top: 0.4rem;
}
.node-diff.neg { border-color: var(--warn); color: var(--warn); }
.node-diff.eq { border-color: var(--line); color: var(--faint); }

.status-chip {
  font-family: var(--mono);
  font-size: 0.56rem;
  font-weight: 700;
  padding: 0.05em 0.4em;
  border: 2px solid var(--border);
  border-radius: 2px;
  color: var(--fg);
  white-space: nowrap;
}
.status-chip.s-healthy { background: var(--healthy); }
.status-chip.s-warning { background: var(--warning); }
.status-chip.s-error { background: var(--error); }
.status-chip.s-external { background: var(--external); }

.connector {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.05rem;
  min-width: 56px;
  flex-shrink: 0;
  color: var(--fg);
}
.connector-label { font-family: var(--mono); font-size: 0.56rem; font-weight: 700; color: var(--faint); }
.connector-arrow { font-size: 0.95rem; line-height: 1; color: var(--fg); }
.connector-line { width: 100%; height: 2px; background: var(--border); }

.branch-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  margin-top: 0.85rem;
  padding-left: clamp(0.5rem, 20%, 235px);
  min-width: max-content;
}
.branch-tag {
  font-family: var(--mono);
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--info);
  background: var(--bg);
  border: 2px dashed var(--info);
  border-radius: 2px;
  padding: 0 0.35em;
  white-space: nowrap;
}
.branch-dash { width: 40px; border-top: 3px dashed var(--info); flex-shrink: 0; }
.node-compact { width: 178px; }
.node-compact .node-records { font-size: 1rem; }

.diagram-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.6rem 1.2rem;
  flex-wrap: wrap;
  border-top: 3px solid var(--border);
  margin-top: 0.9rem;
  padding-top: 0.7rem;
  font-size: 0.7rem;
  color: var(--faint);
}
.legend { display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem; }
.legend .legend-item { font-size: 0.68rem; padding: 0; margin: 0; }
.hint { font-family: var(--mono); font-size: 0.62rem; }

.mermaid-src {
  margin: 0.9rem 0 0;
  background: var(--bg);
  border: 3px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0.8rem 1rem;
  overflow-x: auto;
  font-family: var(--mono);
  font-size: 0.68rem;
  line-height: 1.65;
  color: var(--fg);
  white-space: pre;
}
.mermaid-src[hidden] { display: none; }

.split-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 1rem; }
.split-grid > .card { margin: 0; }

.metrics-list { display: flex; flex-direction: column; gap: 0; }
.metric-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 0.8rem;
  padding: 0.45rem 0;
  border-bottom: 2px solid var(--line);
}
.metric-row:last-child { border-bottom: none; }
.metric-row .k { color: var(--faint); font-size: 0.78rem; }
.metric-row .v { font-family: var(--mono); font-weight: 700; font-size: 0.95rem; }
.metric-row .v small { color: var(--faint); font-weight: 400; font-size: 0.62em; }
.metric-row .v.good { color: var(--accent-ink); }
.metric-row .v.warn { color: var(--warn); }
.metric-row .v.bad { color: var(--danger); }

.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.7rem; }
.stat {
  background: var(--bg);
  border: 3px solid var(--border);
  border-radius: 2px;
  padding: 0.7rem 0.8rem;
}
.stat .label { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em; color: var(--faint); }
.stat .value { font-family: var(--mono); font-size: 1.4rem; font-weight: 700; line-height: 1.3; margin-top: 0.1rem; }
.stat .value small { font-size: 0.5em; color: var(--faint); font-weight: 400; margin-left: 0.15em; }
.stat .delta { font-family: var(--mono); font-size: 0.62rem; color: var(--faint); }
.stat .delta.up { color: var(--warn); }
.stat .delta.down { color: var(--accent-ink); }

.chart-wrap { width: 100%; overflow: hidden; color: var(--fg); }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.chart-note { display: flex; justify-content: space-between; gap: 0.5rem; font-family: var(--mono); font-size: 0.6rem; font-weight: 700; color: var(--faint); margin-top: 0.3rem; }

.lat-list { display: flex; flex-direction: column; gap: 0.6rem; }
.lat-row { display: grid; grid-template-columns: 96px minmax(0, 1fr) 66px; align-items: center; gap: 0.55rem; font-size: 0.76rem; }
.lat-row .name { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lat-track { height: 12px; border: 2px solid var(--border); border-radius: 2px; background: var(--bg); overflow: hidden; }
.lat-fill { display: block; height: 100%; background: var(--healthy); border-right: 2px solid var(--border); }
.lat-fill.s-warning { background: var(--warning); }
.lat-fill.s-error { background: var(--error); }
.lat-fill.s-external { background: var(--external); }
.lat-row .val { font-family: var(--mono); font-size: 0.68rem; font-weight: 700; text-align: right; color: var(--fg); }

.error-list { display: flex; flex-direction: column; gap: 0.5rem; }
.error-item {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 0.6rem;
  align-items: start;
  padding: 0.55rem 0.65rem;
  background: var(--bg);
  border: 2px solid var(--border);
  border-left: 10px solid var(--warning);
  border-radius: 2px;
}
.error-item.s-error { border-left-color: var(--error); }
.error-item .time { font-family: var(--mono); font-size: 0.62rem; font-weight: 700; color: var(--faint); padding-top: 0.1rem; }
.error-item .msg { font-size: 0.78rem; line-height: 1.5; color: var(--fg); }
.error-item .meta { font-family: var(--mono); font-size: 0.6rem; color: var(--faint); margin-top: 0.1rem; }
.error-item .count {
  font-family: var(--mono);
  font-size: 0.64rem;
  font-weight: 700;
  color: var(--fg);
  background: var(--warning);
  border: 2px solid var(--border);
  border-radius: 2px;
  padding: 0 0.35em;
  white-space: nowrap;
}

.arch-flow { display: flex; flex-direction: column; gap: 0.75rem; }
.arch-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.node.static { cursor: default; width: 178px; }

<script>
const FALLBACK_SNAPSHOT = {
  timestamp: "2026-10-27T09:15:02Z",
  pipeline: "etl-main",
  steps: [
    { step_id: "Extract", label: "Extract", records_in: 1240, records_out: 1240, elapsed_ms: 46, status: "Healthy", message: "" },
    { step_id: "Transform", label: "Transform", records_in: 1240, records_out: 1180, elapsed_ms: 121, status: "Warning", message: "60 件がスキーマ検証で隔離されました" },
    { step_id: "Load", label: "Load", records_in: 1180, records_out: 1180, elapsed_ms: 31, status: "Healthy", message: "" }
  ],
  quarantine: { step_id: "error-handler", label: "@error-handler", records_in: 60, records_out: 60, elapsed_ms: 8, status: "External", message: "隔離レコードを error log に書き込み" },
  errors: [
    { at: "09:14:58", step_id: "Transform", kind: "schema", message: "フィールド amount が数値ではありません", count: 37 },
    { at: "09:14:41", step_id: "Extract", kind: "timeout", message: "source shard 3 の応答が遅延", count: 12 },
    { at: "09:13:12", step_id: "Transform", kind: "schema", message: "必須フィールド customer_id が欠落", count: 11 }
  ]
};

const FALLBACK_PREVIOUS = {
  timestamp: "2026-10-27T09:14:59Z",
  pipeline: "etl-main",
  steps: [
    { step_id: "Extract", label: "Extract", records_in: 1200, records_out: 1200, elapsed_ms: 44, status: "Healthy", message: "" },
    { step_id: "Transform", label: "Transform", records_in: 1200, records_out: 1160, elapsed_ms: 96, status: "Warning", message: "40 件がスキーマ検証で隔離されました" },
    { step_id: "Load", label: "Load", records_in: 1160, records_out: 1160, elapsed_ms: 29, status: "Healthy", message: "" }
  ],
  quarantine: { step_id: "error-handler", label: "@error-handler", records_in: 40, records_out: 40, elapsed_ms: 7, status: "External", message: "隔離レコードを error log に書き込み" },
  errors: [
    { at: "09:14:40", step_id: "Transform", kind: "schema", message: "フィールド amount が数値ではありません", count: 28 },
    { at: "09:14:22", step_id: "Extract", kind: "timeout", message: "source shard 3 の応答が遅延", count: 9 }
  ]
};

const PERSPECTIVES = {
  "data-pipeline": {
    title: "データ処理パイプライン",
    sub: "パイプラインの実行状態をライブ表示",
    file: "diagram.mmd"
  },
  "overall-architecture": {
    title: "全体アーキテクチャ",
    sub: "Goose エンジン、.omm ストア、ビューアの接続構成",
    file: "diagram.mmd"
  },
  "error-handler": {
    title: "エラーハンドリング",
    sub: "隔離レコードとエラーイベントの追跡",
    file: "description.md"
  },
  "performance-metrics": {
    title: "パフォーマンス指標",
    sub: "スループット・レイテンシ・隔離レコード数の時系列",
    file: "metrics.json"
  }
};

const STATUS_LABEL = { Healthy: "Healthy", Warning: "Warning", Error: "Error", External: "External" };
const STATUS_RANK = { Healthy: 0, External: 0, Warning: 1, Error: 2 };
const num = new Intl.NumberFormat("ja-JP");

const state = {
  live: true,
  diff: false,
  perspective: "data-pipeline",
  selected: null,
  snap: null,
  prev: null,
  history: [],
  mermaidOpen: false,
  forcedError: false,
  source: "embedded sample",
  quality: [],
  metaIssues: [],
  config: null,
  pipelines: [],
  pipelineId: null,
  metaSource: "built-in defaults",
  engine: "simulation",
  sourceHash: null,
  sourceSnap: null,
  filePollingDisabled: false,
  pollFailures: 0,
  pendingLoads: 0,
  loadToken: 0
};

const $ = (selector, root = document) => root.querySelector(selector);
const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));

const esc = (value) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
}[ch]));

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const randInt = (min, max) => Math.floor(min + Math.random() * (max - min + 1));
const statusClass = (status) => String(status || "Healthy").toLowerCase();

function adoptSnapshot(data, options = {}) {
  const result = PipelineData.validateSnapshot(data);
  if (!options.silent) state.quality = result.issues;
  return result.snapshot;
}

function currentPipeline() {
  return state.pipelines.find((pipeline) => pipeline.id === state.pipelineId) || state.pipelines[0] || null;
}

function metricsLabel(pipeline) {
  if (!pipeline) return "—";
  const match = pipeline.metricsPath.match(/(?:^|\/)(data\/[^/]+\.json)$/);
  return match ? match[1] : pipeline.metricsPath;
}

function currentConfig() {
  return state.config || PipelineData.normalizeConfig(null, window.location.href, window.location.href);
}

const META_FILE = "../.omm/data-pipeline/meta.yaml";
let pollTimer = null;

async function fetchText(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.text();
}

async function loadMeta() {
  const metaUrl = new URL(META_FILE, window.location.href).href;
  try {
    const text = await fetchText(metaUrl);
    const parsed = PipelineData.parseYaml(text);
    if (!parsed || !Object.keys(parsed).length) throw new Error("空の YAML");
    state.config = PipelineData.normalizeConfig(parsed, metaUrl, window.location.href);
    state.metaSource = ".omm/data-pipeline/meta.yaml";
    state.metaIssues = [];
  } catch (error) {
    state.config = PipelineData.normalizeConfig(null, metaUrl, window.location.href);
    state.metaSource = "built-in defaults";
    state.metaIssues = [{
      level: "warn",
      path: "meta.yaml",
      message: `meta.yaml を読み込めませんでした (${error.message})。既定値で動作します。`
    }];
  }
  state.pipelines = state.config.pipelines;
}

async function loadPipeline(pipeline) {
  const token = ++state.loadToken;
  const target = pipeline || state.pipelines[0] || null;
  state.pipelineId = target ? target.id : null;
  state.selected = null;
  state.forcedError = false;
  state.filePollingDisabled = false;
  state.pollFailures = 0;
  state.sourceHash = null;
  state.metaIssues = state.metaIssues.filter((issue) => issue.path !== "metrics_url");

  let current = null;
  let previous = null;
  let source = "embedded";
  let engine = "simulation";
  let filePollingDisabled = false;
  let sourceHash = null;

  if (target && target.metricsUrl) {
    try {
      const [currentText, previousText] = await Promise.all([
        fetchText(target.metricsUrl),
        target.prevUrl ? fetchText(target.prevUrl).catch(() => null) : Promise.resolve(null)
      ]);
      if (token !== state.loadToken) return false;
      current = JSON.parse(currentText);
      sourceHash = PipelineData.hashText(currentText);
      if (previousText) {
        try {
          previous = JSON.parse(previousText);
        } catch (error) {
          previous = null;
        }
      }
      source = "file";
      engine = "file poll";
    } catch (error) {
      if (token !== state.loadToken) return false;
      source = "embedded (fetch failed)";
    }
  }

  // A newer switch may have started while this response was in flight.
  if (token !== state.loadToken) return false;

  if (!current) {
    current = FALLBACK_SNAPSHOT;
    previous = FALLBACK_PREVIOUS;
    if (!source.startsWith("embedded")) source = "embedded";
    filePollingDisabled = true;
    engine = "simulation";
  }

  state.source = source;
  state.engine = engine;
  state.filePollingDisabled = filePollingDisabled;
  state.sourceHash = sourceHash;
  state.snap = adoptSnapshot(current);
  state.prev = previous ? adoptSnapshot(previous, { silent: true }) : null;
  state.sourceSnap = state.source === "file" ? state.snap : null;
  seedHistory();
  return true;
}

function pushHistoryPoint(errors) {
  const first = state.snap.steps[0];
  const last = state.snap.steps[state.snap.steps.length - 1];
  const dropped = first && last ? Math.max(0, first.records_out - last.records_out) : 0;
  state.history.push({
    time: new Date().toISOString(),
    throughput: throughputOf(),
    elapsed: totalElapsed(),
    errors: errors === undefined ? dropped : errors
  });
  state.history = state.history.slice(-40);
}

async function refreshPipelineFile() {
  const pipeline = currentPipeline();
  if (!pipeline || !pipeline.metricsUrl || state.filePollingDisabled || state.sourceHash === null) return false;
  const token = state.loadToken;
  const pipelineId = pipeline.id;
  const isStale = () => token !== state.loadToken || state.pipelineId !== pipelineId;
  try {
    const text = await fetchText(pipeline.metricsUrl);
    if (isStale()) return false;
    state.pollFailures = 0;
    const hash = PipelineData.hashText(text);
    if (hash === state.sourceHash) return false;

    const data = JSON.parse(text);
    if (isStale()) return false;
    state.prev = state.sourceSnap || state.snap;
    state.snap = adoptSnapshot(data);
    state.sourceSnap = state.snap;
    state.sourceHash = hash;
    state.source = "file";
    state.engine = "file poll";
    if (state.selected && !findStep(state.selected)) state.selected = null;
    pushHistoryPoint();
    renderAll();
    return true;
  } catch (error) {
    if (isStale()) return false;
    state.pollFailures += 1;
    if (state.pollFailures >= 3) {
      state.filePollingDisabled = true;
      state.source = "embedded (file unavailable)";
      state.engine = "simulation";
      state.metaIssues = [...state.metaIssues, {
        level: "warn",
        path: "metrics_url",
        message: "ファイルの再取得または解析に 3 回失敗したため、クライアント側シミュレーションに切り替えました。"
      }];
      renderAll();
    }
    return false;
  }
}

async function onTick() {
  if (!state.live || state.pendingLoads > 0) return;
  if (!state.filePollingDisabled && state.sourceHash !== null) {
    state.pendingLoads += 1;
    try {
      const refreshed = await refreshPipelineFile();
      if (refreshed) return;
    } finally {
      state.pendingLoads = Math.max(0, state.pendingLoads - 1);
    }
  }
  tick();
}

function startPolling() {
  if (pollTimer) window.clearInterval(pollTimer);
  pollTimer = window.setInterval(onTick, currentConfig().pollIntervalMs);
}

async function reloadAll() {
  await loadMeta();
  const target = state.pipelines.find((pipeline) => pipeline.id === state.pipelineId) || state.pipelines[0];
  await loadPipeline(target);
  renderAll();
  startPolling();
}

function allSteps(snapshot = state.snap) {
  if (!snapshot) return [];
  return [...snapshot.steps, snapshot.quarantine];
}

function findStep(stepId) {
  if (!state.snap) return null;
  if (stepId === "error-handler") return state.snap.quarantine;
  return state.snap.steps.find((step) => step.step_id === stepId) || null;
}

function findByStepId(snapshot, stepId) {
  if (!snapshot) return null;
  if (stepId === "error-handler") return snapshot.quarantine;
  return snapshot.steps.find((step) => step.step_id === stepId) || null;
}

function worstStatus(statuses) {
  return statuses.reduce((worst, status) => (STATUS_RANK[status] > STATUS_RANK[worst] ? status : worst), "Healthy");
}

function pipelineStatus(snapshot = state.snap) {
  if (!snapshot) return "Healthy";
  return worstStatus(snapshot.steps.map((step) => step.status));
}

function totalElapsed(snapshot = state.snap) {
  if (!snapshot) return 0;
  return snapshot.steps.reduce((sum, step) => sum + step.elapsed_ms, 0);
}

function throughputOf(snapshot = state.snap) {
  if (!snapshot || !snapshot.steps.length) return 0;
  const seconds = totalElapsed(snapshot) / 1000;
  const last = snapshot.steps[snapshot.steps.length - 1];
  return seconds > 0 ? Math.round(last.records_out / seconds) : 0;
}

function quarantineRateOf(snapshot = state.snap) {
  if (!snapshot || !snapshot.steps.length) return 0;
  const first = snapshot.steps[0];
  const last = snapshot.steps[snapshot.steps.length - 1];
  const dropped = Math.max(0, first.records_out - last.records_out);
  return first.records_out > 0 ? (dropped / first.records_out) * 100 : 0;
}

function slowestStep(snapshot = state.snap) {
  if (!snapshot) return null;
  return snapshot.steps.reduce((slowest, step) => (
    !slowest || step.elapsed_ms > slowest.elapsed_ms ? step : slowest
  ), null);
}

function timeOnly(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "--:--:--";
  return date.toLocaleTimeString("ja-JP", { hour12: false });
}

function fullTime(iso) {
  const date = new Date(iso);
  if (Number.isNaN(date.getTime())) return "--";
  return date.toLocaleString("ja-JP", {
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  });
}

function deltaFor(step) {
  if (!state.prev) return null;
  const prevStep = findByStepId(state.prev, step.step_id);
  if (!prevStep) return null;
  return {
    records: step.records_out - prevStep.records_out,
    elapsed: Math.round(step.elapsed_ms - prevStep.elapsed_ms)
  };
}

function deltaChip(step) {
  if (!state.diff) return "";
  const delta = deltaFor(step);
  if (!delta) return "";
  const records = delta.records === 0 ? "±0" : `${delta.records > 0 ? "+" : ""}${num.format(delta.records)}`;
  const elapsed = delta.elapsed === 0 ? "±0" : `${delta.elapsed > 0 ? "+" : ""}${delta.elapsed}`;
  const kind = delta.records === 0 && delta.elapsed === 0 ? "eq" : delta.records < 0 ? "neg" : "";
  return `<span class="node-diff ${kind}">${records} rec · ${elapsed} ms</span>`;
}

function changed(step) {
  const delta = deltaFor(step);
  if (!delta) return false;
  return Math.abs(delta.records) >= 10 || Math.abs(delta.elapsed) >= 8;
}

function renderNode(step, options = {}) {
  const selected = state.selected === step.step_id;
  const classes = [
    "node",
    options.compact ? "node-compact" : "",
    options.static ? "static" : "",
    selected ? "is-selected" : "",
    state.diff && changed(step) ? "is-changed" : ""
  ].filter(Boolean).join(" ");
  const tag = options.static ? "div" : "button";
  const attrs = options.static
    ? 'role="group"'
    : `type="button" data-step="${esc(step.step_id)}" aria-pressed="${selected}"`;
  const inLabel = step.records_in !== step.records_out
    ? ` · in ${num.format(step.records_in)}`
    : "";
  return `
    <${tag} class="${classes}" data-status="${esc(step.status)}" ${attrs}>
      <span class="node-top">
        <span class="node-name">${esc(step.label || step.step_id)}</span>
        <span class="status-chip s-${statusClass(step.status)}">${esc(STATUS_LABEL[step.status] || step.status)}</span>
      </span>
      <span class="node-records">${num.format(step.records_out)}<small> rec</small></span>
      <span class="node-meta">${num.format(step.elapsed_ms)} ms${inLabel}</span>
      ${deltaChip(step)}
    </${tag}>`;
}

function renderConnector(label) {
  return `

function renderErrors() {

    || state.snap.steps[1]
    || state.snap.steps[0]
    || { step_id: "unknown", label: "—", records_in: 0, records_out: 0, elapsed_ms: 0, status: "Warning", message: "" };
  const errorItems = errors.length
    ? errors.map((error) => `

    : `<p class="rail-empty"><span class="status-dot s-healthy"></span>エラーなし</p>`;

  return `

        <div>

}

function buildChart(points, key, color, label, unit) {
  const width = 640;
  const height = 190;
  const pad = { left: 46, right: 14, top: 16, bottom: 26 };
  const values = points.map((point) => point[key]);
  const min = Math.min(...values);
  const max = Math.max(...values);
  const span = max - min || 1;
  const x = (index) => pad.left + (index / Math.max(1, points.length - 1)) * (width - pad.left - pad.right);
  const y = (value) => pad.top + (1 - (value - min) / span) * (height - pad.top - pad.bottom);
  const coords = points.map((point, index) => `${x(index).toFixed(1)},${y(point[key]).toFixed(1)}`).join(" ");
  const area = `${pad.left},${height - pad.bottom} ${coords} ${width - pad.right},${height - pad.bottom}`;
  const grid = [0, 0.25, 0.5, 0.75, 1].map((fraction) => {
    const gy = pad.top + fraction * (height - pad.top - pad.bottom);
    const value = Math.round(max - fraction * span);
    return `<line x1="${pad.left}" y1="${gy.toFixed(1)}" x2="${width - pad.right}" y2="${gy.toFixed(1)}" stroke="currentColor" stroke-opacity="0.08" />
      <text x="${pad.left - 8}" y="${(gy + 3).toFixed(1)}" text-anchor="end" font-family="Roboto Mono, monospace" font-size="9" fill="#525252">${value >= 1000 ? (value / 1000).toFixed(1) + "k" : value}</text>`;
  }).join("");
  const gradientId = `grad-${key}`;
  const first = points[0];
  const last = points[points.length - 1];
  return `
    <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}の推移">
      <defs>
        <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${color}" stop-opacity="0.28" />
          <stop offset="100%" stop-color="${color}" stop-opacity="0" />
        </linearGradient>
      </defs>
      ${grid}
      <polygon points="${area}" fill="url(#${gradientId})" />
      <polyline points="${coords}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" />
      <circle cx="${x(points.length - 1).toFixed(1)}" cy="${y(last[key]).toFixed(1)}" r="3.5" fill="${color}" />
      <text x="${pad.left}" y="${height - 8}" font-family="Roboto Mono, monospace" font-size="9" fill="#525252">${esc(timeOnly(first.time))}</text>
      <text x="${width - pad.right}" y="${height - 8}" text-anchor="end" font-family="Roboto Mono, monospace" font-size="9" fill="#525252">${esc(timeOnly(last.time))}</text>
    </svg>
    <div class="chart-note"><span>${esc(label)}</span><span>${num.format(last[key])} ${esc(unit)}</span></div>`;
}

function renderPerformance() {
  const history = state.history;
  const steps = allSteps();
  const maxLatency = Math.max(...steps.map((step) => step.elapsed_ms), 1);
  const latencyRows = steps.map((step) => `
    <div class="lat-row">
      <span class="name" title="${esc(step.label || step.step_id)}">${esc(step.label || step.step_id)}</span>
      <span class="lat-track"><span class="lat-fill s-${statusClass(step.status)}" style="width:${Math.max(3, (step.elapsed_ms / maxLatency) * 100).toFixed(1)}%"></span></span>
      <span class="val">${num.format(step.elapsed_ms)} ms</span>
    </div>`).join("");
  const recentRows = history.slice(-5).reverse().map((point) => `
    <tr>
      <td class="mono">${esc(timeOnly(point.time))}</td>
      <td class="mono">${num.format(point.throughput)} rec/s</td>
      <td class="mono">${num.format(point.elapsed)} ms</td>
      <td class="mono">${num.format(point.errors)}</td>
    </tr>`).join("");

  return `
    <section class="card">
      <div class="card-head">
        <div>
          <span class="eyebrow info">performance-metrics</span>
          <h2>スループット推移</h2>
          <p class="sub">直近 ${history.length} サンプル / 2.5 秒間隔</p>
        </div>
      </div>
      <div class="chart-wrap">${history.length > 1 ? buildChart(history, "throughput", "#00a878", "スループット", "rec/s") : ""}</div>
    </section>
    <div class="split-grid">
      <section class="card">
        <div class="card-head">
          <div><span class="eyebrow">Latency</span><h2>ステップ別レイテンシ</h2></div>
        </div>
        <div class="lat-list">${latencyRows}</div>
        <p class="arch-note">合計 ${num.format(totalElapsed())} ms / 最遅 ${esc(slowestStep() ? slowestStep().label : "—")} ${slowestStep() ? num.format(slowestStep().elapsed_ms) + " ms" : ""}</p>
      </section>
      <section class="card">
        <div class="card-head">
          <div><span class="eyebrow">History</span><h2>直近の実行</h2></div>
        </div>
        <div class="table-wrap">
          <table class="history-table">
            <thead><tr><th>時刻</th><th>Throughput</th><th>Latency</th><th>Quarantine</th></tr></thead>
            <tbody>${recentRows}</tbody>
          </table>
        </div>
      </section>
    </div>
    <section class="card">
      <div class="card-head">
        <div><span class="eyebrow">Quarantine</span><h2>隔離レコード数の推移</h2></div>
      </div>
      <div class="chart-wrap">${history.length > 1 ? buildChart(history, "errors", "#b45309", "隔離レコード数", "rec") : ""}</div>
    </section>`;
}

function renderMain() {
  const issues = state.snap.steps.filter((step) => step.status !== "Healthy");
  const worst = pipelineStatus();
  let strip = "";
  if (!issues.length) {
    strip = `<div class="alert-strip is-healthy"><span class="status-dot s-healthy"></span><strong>全ステップ正常</strong><span class="alert-copy">直近の実行で警告・障害は検出されていません。</span></div>`;
  } else {
    const lead = issues[0];
    const others = issues.length > 1 ? ` 他 ${issues.length - 1} 件` : "";
    strip = `
      <div class="alert-strip ${worst === "Error" ? "is-error" : "is-warning"}">
        <span class="status-dot ${worst === "Error" ? "s-error" : "s-warning"}"></span>
        <strong>${worst === "Error" ? "障害を検出" : "警告あり"}</strong>
        <span class="alert-copy"><b>${esc(lead.label)}</b> — ${esc(lead.message || "処理遅延を検出")}${others}</span>
        <button class="alert-link" type="button" data-step="${esc(lead.step_id)}">詳細を見る</button>
      </div>`;
  }

  let content = "";
  if (state.perspective === "data-pipeline") content = renderPipeline();
  else if (state.perspective === "overall-architecture") content = renderArchitecture();
  else if (state.perspective === "error-handler") content = renderErrors();
  else content = renderPerformance();

  $("#main").innerHTML = strip + content;
  updateScrollHint();
}

function updateScrollHint() {
  const scroller = $(".diagram-scroll");
  const hint = $(".scroll-hint");
  if (!scroller || !hint) return;
  hint.hidden = scroller.scrollWidth <= scroller.clientWidth + 1;
}

function renderInspector() {
  const inspector = $("#inspector");
  const step = state.selected ? findStep(state.selected) : null;
  if (!step) {
    const snapshot = state.snap;
    inspector.innerHTML = `
      <div class="rail-head">
        <span class="eyebrow">Inspector</span>
        <h3>ライブ状態</h3>
      </div>
      <p class="inspector-empty"><b>ノードをクリック</b>すると、ここにステップの詳細が表示されます。</p>
      <dl class="kv">
        <div><dt>pipeline</dt><dd>${esc(snapshot.pipeline || "etl-main")}</dd></div>
        <div><dt>steps</dt><dd>${snapshot.steps.length}</dd></div>
        <div><dt>total latency</dt><dd>${num.format(totalElapsed())} ms</dd></div>
        <div><dt>throughput</dt><dd>${num.format(throughputOf())} rec/s</dd></div>
        <div><dt>quarantined</dt><dd>${num.format(snapshot.quarantine.records_in)} rec</dd></div>
      </dl>`;
    return;
  }

  const delta = state.diff ? deltaFor(step) : null;
  const isExternal = step.status === "External";
  const source = isExternal ? "error-handler" : state.perspective;
  const messageClass = step.status === "Error" ? "is-error" : step.status === "Warning" ? "is-warning" : "";
  inspector.innerHTML = `
    <div class="rail-head">
      <span class="eyebrow">Inspector</span>
      <h3>${esc(step.label || step.step_id)}</h3>
    </div>
    <span class="status-chip s-${statusClass(step.status)}">${esc(STATUS_LABEL[step.status] || step.status)}</span>
    <dl class="kv">
      <div><dt>step_id</dt><dd>${esc(step.step_id)}</dd></div>
      <div><dt>perspective</dt><dd>${esc(source)}</dd></div>
      <div><dt>records in</dt><dd>${num.format(step.records_in)}</dd></div>
      <div><dt>records out</dt><dd>${num.format(step.records_out)}</dd></div>
      <div><dt>elapsed</dt><dd>${num.format(step.elapsed_ms)} ms</dd></div>
      ${delta ? `<div><dt>diff</dt><dd>${delta.records >= 0 ? "+" : ""}${num.format(delta.records)} rec / ${delta.elapsed >= 0 ? "+" : ""}${delta.elapsed} ms</dd></div>` : ""}
      <div><dt>updated</dt><dd>${esc(timeOnly(state.snap.timestamp))}</dd></div>
    </dl>
    ${step.message ? `<div class="detail-message ${messageClass}">${esc(step.message)}</div>` : ""}
    <button class="clear-btn" type="button" data-clear>選択を解除</button>`;
}

function renderAlertsCard() {
  const issues = allSteps().filter((step) => step.status === "Warning" || step.status === "Error");
  const card = $("#alerts-card");
  const list = issues.length
    ? issues.map((step) => `
        <button class="rail-alert" type="button" data-step="${esc(step.step_id)}">
          <span class="status-dot ${step.status === "Error" ? "s-error" : "s-warning"}"></span>
          <span><b>${esc(step.label || step.step_id)}</b><span>${esc(step.message || "要確認")}</span></span>
        </button>`).join("")
    : `<p class="rail-empty"><span class="status-dot s-healthy"></span>ピン留めされたアラートはありません</p>`;
  card.innerHTML = `
    <div class="rail-head">
      <span class="eyebrow ${issues.length ? "warn" : ""}">Alerts</span>
      <h3>${issues.length ? `要対応 ${issues.length} 件` : "アラート"}</h3>
    </div>
    <div class="rail-alert-list">${list}</div>`;
}

function renderMetaCard() {
  const config = currentConfig();
  const pipeline = currentPipeline();
  const issues = [...state.metaIssues, ...state.quality];
  const errors = issues.filter((issue) => issue.level === "error").length;
  const warnings = issues.length - errors;
  const qualityClass = errors ? "is-error" : warnings ? "is-warning" : "is-ok";
  const qualityText = errors
    ? `エラー ${errors} 件 / 警告 ${warnings} 件`
    : warnings ? `警告 ${warnings} 件` : "スキーマ検証 OK";
  const issueList = issues.length
    ? `<ul class="issue-list">${issues.slice(0, 4).map((issue) => `
        <li class="${issue.level === "error" ? "is-error" : ""}"><b>${esc(issue.path)}</b> ${esc(issue.message)}</li>`).join("")}</ul>
       ${issues.length > 4 ? `<p class="issue-list">ほか ${issues.length - 4} 件</p>` : ""}`
    : "";

  $("#meta-card").innerHTML = `
    <div class="rail-head">
      <span class="eyebrow info">Meta</span>
      <h3>ストア情報</h3>
    </div>
    <dl class="kv">
      <div><dt>pipeline</dt><dd>${esc(pipeline ? pipeline.id : "—")} · ${esc(pipeline ? pipeline.label : "—")}</dd></div>
      <div><dt>updated</dt><dd>${esc(fullTime(state.snap.timestamp))}</dd></div>
      <div><dt>meta_updated</dt><dd>${config.updated ? esc(fullTime(config.updated)) : "—"}</dd></div>
      <div><dt>git_commit</dt><dd>${esc(config.gitCommit)}</dd></div>
      <div><dt>meta source</dt><dd>${esc(state.metaSource)}</dd></div>
      <div><dt>metrics_url</dt><dd>${esc(pipeline ? pipeline.metricsPath : "—")}</dd></div>
      <div><dt>poll_interval_ms</dt><dd>${num.format(config.pollIntervalMs)} ms</dd></div>
      <div><dt>update engine</dt><dd>${esc(state.engine)}</dd></div>
      <div><dt>data source</dt><dd>${esc(state.source)}</dd></div>
      <div><dt>diff baseline</dt><dd>${state.prev ? esc(timeOnly(state.prev.timestamp)) : "—"}</dd></div>
    </dl>
    <div class="quality ${qualityClass}">
      <p class="quality-head">データ検証: ${qualityText}</p>
      ${issueList}
    </div>
    <button class="clear-btn" type="button" data-action="reload-meta">meta.yaml を再読込</button>`;
}

function renderPipelineSelect() {
  const select = $("#pipeline-select");
  if (!select) return;
  const signature = `${state.pipelines.map((pipeline) => `${pipeline.id}:${pipeline.label}`).join("|")}#${state.pipelineId}`;
  if (select.dataset.signature !== signature) {
    select.innerHTML = state.pipelines
      .map((pipeline) => `<option value="${esc(pipeline.id)}"${pipeline.id === state.pipelineId ? " selected" : ""}>${esc(pipeline.label)}</option>`)
      .join("");
    select.dataset.signature = signature;
  }
  select.disabled = state.pipelines.length < 2;
  const pipeline = currentPipeline();
  $("#pipeline-note").textContent = pipeline ? `${pipeline.id} · ${state.source}` : "パイプライン未定義";
}

function renderHeader() {
  const meta = PERSPECTIVES[state.perspective];
  const config = currentConfig();
  const pipeline = currentPipeline();
  $("#crumb").innerHTML = `.omm / <b>${esc(state.perspective)}</b> / ${esc(meta.file)}`;
  $("#page-title").textContent = meta.title;
  const trail = state.snap.steps.map((step) => step.label).join(" → ");
  const sub = state.perspective === "data-pipeline"
    ? (trail ? `${trail} の実行状態をライブ表示` : "表示できるステップがありません")
    : meta.sub;
  $("#page-sub").textContent = pipeline ? `${sub} · ${pipeline.label}` : sub;
  $("#updated-time").textContent = timeOnly(state.snap.timestamp);
  const worst = pipelineStatus();
  const pill = $("#health-pill");
  pill.className = `health-pill is-${statusClass(worst)}`;
  pill.innerHTML = `<span class="status-dot s-${statusClass(worst)}"></span><span>${worst === "Healthy" ? "Healthy" : worst === "Warning" ? "Warning" : "Error"}</span>`;
  $("#live-btn").setAttribute("aria-pressed", String(state.live));
  $("#live-label").textContent = state.live ? "LIVE" : "PAUSED";
  $("#diff-btn").setAttribute("aria-pressed", String(state.diff));
  const inject = $("#inject-btn");
  inject.textContent = state.forcedError ? "復旧させる" : "障害を注入";
  inject.classList.toggle("is-on", state.forcedError);
  $("#side-metrics-path").textContent = metricsLabel(pipeline);
  $("#side-poll").textContent = `${num.format(config.pollIntervalMs)} ms`;
  $("#side-source").textContent = state.source;
}

function renderNav() {
  $$("#nav .nav-item").forEach((button) => {
    button.classList.toggle("is-active", button.dataset.persp === state.perspective);
  });
  const worst = pipelineStatus();
  const dots = {
    "data-pipeline": state.live ? worst : "paused",
    "overall-architecture": worst,
    "error-handler": state.snap.errors.length ? (worst === "Error" ? "error" : "external") : "healthy",
    "performance-metrics": worst === "Error" ? "error" : "healthy"
  };
  Object.entries(dots).forEach(([key, status]) => {
    const dot = $(`[data-dot="${key}"]`);
    if (!dot) return;
    dot.className = `status-dot s-${statusClass(status)}`;
  });
  $('[data-badge="data-pipeline"]').textContent = state.snap.steps.length;
  $('[data-badge="error-handler"]').textContent = state.snap.errors.length;
}

function renderAll() {
  renderHeader();
  renderNav();
  renderPipelineSelect();
  renderMain();
  renderInspector();
  renderAlertsCard();
  renderMetaCard();
}

function selectStep(stepId) {
  state.selected = state.selected === stepId ? null : stepId;
  if (stepId && state.perspective !== "data-pipeline" && state.perspective !== "error-handler") {
    state.perspective = "data-pipeline";
  }
  renderAll();
}

function mermaidSource() {
  const lines = ["graph LR"];
  const classFor = (status) => statusClass(status);
  state.snap.steps.forEach((step) => {
    lines.push(`    ${step.step_id}["${esc(step.label)}<br/>${num.format(step.records_out)} rec<br/>${num.format(step.elapsed_ms)}ms"]:::${classFor(step.status)}`);
  });
  const quarantine = state.snap.quarantine;
  lines.push(`    ErrorLog["${esc(quarantine.label)}<br/>${num.format(quarantine.records_in)} rec<br/>${num.format(quarantine.elapsed_ms)}ms"]:::external`);
  lines.push("");
  state.snap.steps.forEach((step, index) => {
    if (index === 0) return;
    lines.push(`    ${state.snap.steps[index - 1].step_id} -->|"${num.format(state.snap.steps[index - 1].records_out)}"| ${step.step_id}`);
  });
  const branchSourceId = (state.snap.steps[1] && state.snap.steps[1].step_id) || "Transform";
  lines.push(`    ${branchSourceId} -.->|"${num.format(quarantine.records_in)}"| ErrorLog`);
  lines.push("");
  const statusMap = currentConfig().statusMap;
  ["Healthy", "Warning", "Error", "External"].forEach((status) => {
    const definition = statusMap[status] || PipelineData.DEFAULT_STATUS_MAP[status];
    lines.push(`    ${/^classDef\s/.test(definition) ? definition : `classDef ${statusClass(status)} ${definition}`}`);
  });
  return lines.join("\n");
}

function seedHistory() {
  const base = throughputOf() || 5000;
  const baseLatency = totalElapsed() || 200;
  const baseErrors = state.snap.quarantine.records_in || 40;
  const now = Date.now();
  state.history = Array.from({ length: 28 }, (_, index) => {
    const order = 28 - index;
    const wave = 1 + 0.09 * Math.sin(order * 0.52) + 0.04 * Math.cos(order * 0.21);
    return {
      time: new Date(now - order * currentConfig().pollIntervalMs).toISOString(),
      throughput: Math.round(base * wave),
      elapsed: Math.round(baseLatency * (2 - wave)),
      errors: Math.max(0, Math.round(baseErrors * (2 - wave)))
    };
  });
}

function tick() {
  if (!state.snap || !state.snap.steps.length) return;
  const previous = state.snap;
  const now = new Date();
  const timeLabel = now.toLocaleTimeString("ja-JP", { hour12: false });
  const forceError = state.forcedError;
  const triggerWarning = !forceError && Math.random() < 0.2;
  const targetIndex = previous.steps.length > 1 ? 1 : -1;
  const firstIn = Math.max(1, previous.steps[0].records_in + randInt(-45, 55));
  const dropped = targetIndex === -1 ? 0 : forceError ? firstIn : triggerWarning ? randInt(45, 95) : randInt(0, 24);
  const targetId = targetIndex >= 0 ? previous.steps[targetIndex].step_id : previous.steps[0].step_id;

  let carry = firstIn;
  const steps = previous.steps.map((step, index) => {
    const recordsIn = carry;
    const recordsOut = index === 0 ? recordsIn : Math.max(0, recordsIn - (index === targetIndex ? dropped : 0));
    carry = recordsOut;
    const isTarget = index === targetIndex;
    const elapsed = isTarget && forceError
      ? randInt(290, 380)
      : clamp(Math.round((step.elapsed_ms || 100) * (0.88 + Math.random() * 0.24)), 5, 900);
    return {
      ...step,
      records_in: recordsIn,
      records_out: recordsOut,
      elapsed_ms: elapsed,
      status: isTarget ? (forceError ? "Error" : triggerWarning ? "Warning" : "Healthy") : "Healthy",
      message: isTarget
        ? forceError
          ? "出力シンクへの接続がタイムアウトしました"
          : triggerWarning
            ? `${dropped} 件がスキーマ検証で隔離されました`
            : ""
        : ""
    };
  });

  const errors = [...previous.errors];
  if (dropped > 0 && (forceError || Math.random() < 0.7)) {
    errors.unshift({
      at: timeLabel,
      step_id: targetId,
      kind: forceError ? "timeout" : Math.random() < 0.7 ? "schema" : "timeout",
      message: forceError ? "出力シンクへの接続がタイムアウトしました" : "スキーマ検証でレコードを隔離",
      count: dropped
    });
  }
  const next = {
    timestamp: now.toISOString(),
    pipeline: previous.pipeline,
    steps,
    quarantine: {
      ...previous.quarantine,
      records_in: dropped,
      records_out: dropped,
      elapsed_ms: dropped > 0 ? randInt(5, 12) : 0
    },
    errors: errors.slice(0, 8)
  };
  state.prev = previous;
  state.snap = adoptSnapshot(next);
  pushHistoryPoint(dropped);
  if (state.selected && !findStep(state.selected)) state.selected = null;
  renderAll();
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const requested = params.get("persp");
  if (requested && PERSPECTIVES[requested]) state.perspective = requested;
  if (params.get("diff") === "1") state.diff = true;
  if (params.get("live") === "0") state.live = false;

  await loadMeta();
  const requestedPipeline = params.get("pipeline");
  const pipeline = state.pipelines.find((item) => item.id === requestedPipeline)
    || state.pipelines.find((item) => item.id === state.config.defaultPipeline)
    || state.pipelines[0];
  await loadPipeline(pipeline);
  renderAll();
  startPolling();
}

$("#nav").addEventListener("click", (event) => {
  const button = event.target.closest("[data-persp]");
  if (!button) return;
  state.perspective = button.dataset.persp;
  state.selected = null;
  renderAll();
});

$("#pipeline-select").addEventListener("change", async (event) => {
  const next = state.pipelines.find((pipeline) => pipeline.id === event.target.value);
  if (!next) return;
  state.pendingLoads += 1;
  try {
    const applied = await loadPipeline(next);
    // Ignore the result of a request superseded by a newer pipeline switch.
    if (!applied) return;
    const url = new URL(window.location.href);
    url.searchParams.set("pipeline", next.id);
    window.history.replaceState(null, "", url);
    renderAll();
  } finally {
    state.pendingLoads = Math.max(0, state.pendingLoads - 1);
  }
});

$("#meta-card").addEventListener("click", (event) => {
  if (!event.target.closest('[data-action="reload-meta"]')) return;
  reloadAll();
});

$("#main").addEventListener("click", (event) => {
  const node = event.target.closest("[data-step]");
  if (node) {
    selectStep(node.dataset.step);
    return;
  }
  const toggle = event.target.closest('[data-action="toggle-mermaid"]');
  if (toggle) {
    state.mermaidOpen = !state.mermaidOpen;
    renderMain();
  }
});

$("#alerts-card").addEventListener("click", (event) => {
  const button = event.target.closest("[data-step]");
  if (!button) return;
  if (state.perspective !== "data-pipeline") state.perspective = "data-pipeline";
  state.selected = button.dataset.step;
  renderAll();
});

document.addEventListener("click", (event) => {
  if (!event.target.closest("[data-clear]")) return;
  state.selected = null;
  renderAll();
});

$("#live-btn").addEventListener("click", () => {
  state.live = !state.live;
  renderAll();
});

$("#diff-btn").addEventListener("click", () => {
  state.diff = !state.diff;
  renderAll();
});

$("#inject-btn").addEventListener("click", () => {
  state.forcedError = !state.forcedError;
  state.selected = (state.snap.steps[1] && state.snap.steps[1].step_id) || "Transform";
  if (!state.live) tick();
  else renderAll();
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && state.selected) {
    state.selected = null;
    renderAll();
  }
});

init();
</script>
</body>
</html>
